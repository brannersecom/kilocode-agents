name: Validate Generated Adapters

on:
  pull_request:
    branches:
      - main
      - codex
      - copilot/add-kilo-code-compatibility
  push:
    branches:
      - main
      - codex
      - copilot/add-kilo-code-compatibility
  workflow_dispatch:

jobs:
  validate-generated-adapters:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate adapter files
        run: |
          python scripts/generate_kilocodemodes.py
          python scripts/generate_codex_assets.py

      - name: Verify generated files are committed
        run: |
          TARGETS=(
            ".kilocodemodes"
            "AGENTS.md"
            ".codex/registry.json"
            ".codex/skills-index.md"
            ".codex/agents-index.md"
          )

          if ! git diff --quiet -- "${TARGETS[@]}"; then
            echo "Generated adapter files are out of date."
            echo "Run these commands locally and commit the result:"
            echo "  python scripts/generate_kilocodemodes.py"
            echo "  python scripts/generate_codex_assets.py"
            echo
            echo "Diff for generated files:"
            git --no-pager diff -- "${TARGETS[@]}"
            exit 1
          fi

      - name: Upload generated adapter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-adapters
          path: |
            .kilocodemodes
            AGENTS.md
            .codex/registry.json
            .codex/skills-index.md
            .codex/agents-index.md
